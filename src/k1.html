/* Layout : sections pleine largeur qui alternent encre et papier ; grandes capitales géométriques + italique serif ;
   le 八 en or, en volume, tourne dans le hero ; films en bande horizontale épinglée ; méthode en panneaux empilés.
   Une seule ambiance (encre / papier / or), choisie. */
:root{
  --ink:#121210; --ink-2:#181816; --paper:#EBE9E2; --paper-2:#E3E0D7;
  --noir:#090908; --noir-2:#0E0D0B; --sheen:rgba(201,155,69,.075);
  --lux:radial-gradient(130% 70% at 50% -12%,rgba(201,155,69,.085),rgba(201,155,69,0) 58%),radial-gradient(70% 60% at 108% 112%,rgba(201,155,69,.05),rgba(201,155,69,0) 60%),radial-gradient(60% 50% at -8% 60%,rgba(255,240,210,.025),rgba(255,240,210,0) 70%),linear-gradient(180deg,#0D0C0A 0%,#080807 100%);
  --cream:#EFEDE6; --cream-2:rgba(239,237,230,.62); --cream-3:rgba(239,237,230,.38); --cream-4:rgba(232,214,178,.13);
  --black:#121210; --black-2:rgba(18,18,16,.64); --black-3:rgba(18,18,16,.42); --black-4:rgba(18,18,16,.14);
  --gold:#C99B45; --gold-2:#F4E1A6; --gold-3:#8C6A2A;
  --display:'Jost',ui-sans-serif,system-ui,'Helvetica Neue',Arial,sans-serif;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --gutter:clamp(16px,4vw,60px); --nav:74px;
  --ease:cubic-bezier(.22,1,.36,1); --swift:cubic-bezier(.76,0,.24,1);
  --bg:var(--ink); --fg:var(--cream); --fg-2:var(--cream-2); --fg-3:var(--cream-3); --line:var(--cream-4);
  color-scheme:dark;
}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:clip}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--noir);color:var(--cream);font-family:var(--display);font-weight:400;font-size:16px;line-height:1.55;overflow-x:clip;-webkit-font-smoothing:antialiased}
img,video,svg,canvas{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left}
::selection{background:var(--gold);color:var(--ink)}
:focus-visible{outline:1px solid var(--gold);outline-offset:4px}
h1,h2,h3,p,dl,dd,figure,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
h1,h2,h3{font-weight:300}
section{position:relative;padding-inline:var(--gutter)}
.gen.dark::before{display:none}
.dark+.dark::before{content:"";position:absolute;left:var(--gutter);right:var(--gutter);top:0;height:1px;background:linear-gradient(90deg,rgba(201,155,69,0),rgba(201,155,69,.28) 50%,rgba(201,155,69,0));pointer-events:none}
.dark{background:var(--lux);background-color:var(--noir);color:var(--cream);--bg:var(--ink);--fg:var(--cream);--fg-2:var(--cream-2);--fg-3:var(--cream-3);--line:var(--cream-4)}
.light{background:var(--paper);color:var(--black);--bg:var(--paper);--fg:var(--black);--fg-2:var(--black-2);--fg-3:var(--black-3);--line:var(--black-4)}
.label{font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg-3)}
.label b{font-weight:500;color:var(--fg)}
.paren{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--fg-2)}
.giant{font-family:var(--display);font-weight:300;font-size:clamp(64px,13vw,220px);line-height:.86;letter-spacing:-.045em;text-transform:uppercase}
.giant .it{font-family:var(--serif);font-style:italic;font-weight:400;text-transform:none;letter-spacing:-.01em;color:var(--fg-2);display:block;font-size:.72em;line-height:1.02}
.big{font-weight:300;font-size:clamp(30px,3.9vw,60px);line-height:1.08;letter-spacing:-.02em}
.body{color:var(--fg-2);font-size:15.5px;line-height:1.6;max-width:34em}
.pill{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border:1px solid var(--line);border-radius:999px;font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg);transition:border-color .5s var(--ease),background-color .5s var(--ease),color .5s var(--ease)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold)}
.pill:hover{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.pill.solid{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill.solid:hover{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.ulink{display:inline-flex;align-items:baseline;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--fg);font-weight:400;letter-spacing:.06em;text-transform:uppercase;font-size:clamp(14px,1.2vw,18px)}
.ulink small{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--fg-3)}
.hr{height:1px;background:var(--line)}
.rv{opacity:0;transform:translateY(26px)}
.rv.in,html.nojs .rv{opacity:1;transform:none}

/* grain, curseur */
.grain{position:fixed;inset:-50%;width:200%;height:200%;pointer-events:none;z-index:60;opacity:.045;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .6 0 0 0 0 .6 0 0 0 0 .55 0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain 1.4s steps(5) infinite;mix-blend-mode:overlay}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-2%)}80%{transform:translate(3%,1%)}100%{transform:translate(0,0)}}
.cursor{opacity:0;position:fixed;top:0;left:0;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--gold);pointer-events:none;z-index:120;mix-blend-mode:difference;transition:width .35s var(--ease),height .35s var(--ease),margin .35s var(--ease);display:none}
.cursor span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#000;opacity:0;transition:opacity .3s;white-space:nowrap}
.cursor.on{width:40px;height:40px;margin:-20px 0 0 -20px}
.cursor.play{width:92px;height:92px;margin:-46px 0 0 -46px;mix-blend-mode:normal;background:var(--gold-2)}
.cursor.play span{opacity:1}
body.has-cursor{cursor:none}
body.has-cursor a,body.has-cursor button,body.has-cursor label,body.has-cursor .card,body.has-cursor summary,body.has-cursor input,body.has-cursor select,body.has-cursor textarea{cursor:none}
body.has-cursor .cursor{display:block}

/* chargeur, rideau */
.loader{position:fixed;inset:0;z-index:96;background:radial-gradient(60% 50% at 50% 46%,rgba(201,155,69,.06),rgba(201,155,69,0) 70%),var(--noir);display:grid;place-items:center;transition:clip-path .9s var(--swift)}
.loader.done{clip-path:inset(0 0 100% 0);pointer-events:none}
.lockup{display:grid;justify-items:center;--f:min(38vh,58vw)}
.lk-box{position:relative;width:var(--f);height:var(--f)}
.lk-frame{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lk-frame rect{fill:none;stroke:rgba(239,237,230,.55);stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.3s cubic-bezier(.65,0,.35,1)}
.lockup.on .lk-frame rect{stroke-dashoffset:0}
.lk-box .lm{position:absolute;inset:0;width:100%;height:100%}
.lockup .lk-frame,.lockup .lk-word,.lockup .lk-rule,.lockup .lk-tag{display:none!important}
.lockup{--f:min(44vh,62vw)}
.lk-name{display:block;width:calc(var(--f) * .92);height:auto;fill:var(--cream);margin-top:calc(var(--f) * .02);opacity:0;transform:translateY(12px);letter-spacing:0;transition:opacity .9s var(--ease),transform 1s var(--ease)}
.lockup.w .lk-name{opacity:.92;transform:none}
.lk-word{width:calc(var(--f) * 1.82);height:auto;fill:var(--cream);margin-top:calc(var(--f) * .3);opacity:0;transform:translateY(14px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.lk-rule{width:calc(var(--f) * .44);height:1px;background:rgba(239,237,230,.6);margin-top:calc(var(--f) * .14);transform:scaleX(0);transition:transform .8s var(--ease) .15s}
.lk-tag{margin-top:calc(var(--f) * .1);font-family:var(--mono);font-size:clamp(9px,calc(var(--f) * .036),14px);letter-spacing:.42em;text-transform:uppercase;color:var(--cream-3);white-space:nowrap;padding-left:.42em;opacity:0;transition:opacity .9s var(--ease) .25s}
.lockup.w .lk-word{opacity:1;transform:none}
.lockup.w .lk-rule{transform:none}
.lockup.w .lk-tag{opacity:1}
.curtain{position:fixed;inset:0;z-index:95;background:radial-gradient(60% 50% at 50% 46%,rgba(201,155,69,.06),rgba(201,155,69,0) 70%),var(--noir);clip-path:inset(100% 0 0 0);display:grid;place-items:center;pointer-events:none;visibility:hidden}
.curtain.in{visibility:visible;pointer-events:auto;clip-path:inset(0 0 0 0);transition:clip-path .55s var(--swift)}
.curtain.out{visibility:visible;clip-path:inset(0 0 100% 0);transition:clip-path .6s var(--swift)}
.curtain::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.clabel{font-family:var(--serif);font-style:italic;font-size:clamp(20px,2.6vw,34px);color:var(--cream-2);display:flex}
.clabel i{display:inline-block;opacity:0;transform:translateY(10px);transition:opacity .5s var(--ease),transform .7s var(--ease)}
.curtain.in .clabel i{opacity:1;transform:none}

/* navigation */
.nav{position:fixed;top:0;left:0;right:0;z-index:70;height:var(--nav);padding-top:env(safe-area-inset-top,0px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-inline:var(--gutter);color:#fff;transition:transform .55s cubic-bezier(.65,0,.35,1)}
.nav.hide{transform:translateY(-110%)}
.nav .brand svg.wm{fill:#F3F1EA;transition:fill .4s}
.nav.ink .brand svg.wm{fill:#121210}
@media (max-resolution:1.49dppx){.nav .brand svg.wm{stroke:#F3F1EA;stroke-width:2.4;stroke-linejoin:round}.nav.ink .brand svg.wm{stroke:#121210}}
.nav.ink .nav-links a{color:rgba(18,18,16,.6)} .nav.ink .nav-links a:hover,.nav.ink .nav-links a.on{color:#121210} .nav.ink .nav-links a::after{background:#121210}
.nav.ink .pill{border-color:rgba(18,18,16,.3);color:#121210} .nav.ink .pill:hover{background:#121210;color:#F3F1EA;border-color:#121210} .nav.ink .pill::before{background:#121210}
.nav.ink .lang button{color:rgba(18,18,16,.5)} .nav.ink .lang button[aria-pressed="true"]{color:#121210} .nav.ink .lang i{color:rgba(18,18,16,.25)}
.nav.ink .burger::before,.nav.ink .burger::after{background:#121210}
.menu-open .nav.hide{transform:none}
.brand{display:flex;align-items:center;gap:12px;justify-self:start}
.brand{gap:14px}
.brand{gap:14px!important}
.brand .mk{width:51px;height:33px;flex:none;visibility:hidden}
.navmark .brule{display:block;width:1px;height:24px;flex:none;background:linear-gradient(180deg,rgba(201,155,69,0),#C99B45 28%,#E9CF8E 50%,#C99B45 72%,rgba(201,155,69,0))}
.navmark{position:fixed;left:var(--gutter);top:calc(var(--nav) / 2 + env(safe-area-inset-top,0px) / 2);transform:translateY(-50%);height:33px;z-index:71;display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .55s cubic-bezier(.65,0,.35,1),opacity .4s}
.navmark svg{width:36px;height:33px;overflow:visible;display:block}
.nav.hide~.navmark{transform:translateY(-50%) translateY(-220%)}
.menu-open .navmark{transform:translateY(-50%)}
@keyframes ember{0%,100%{filter:drop-shadow(0 0 2px rgba(232,163,63,.3))}50%{filter:drop-shadow(0 0 8px rgba(232,163,63,.85))}}
@keyframes emberb{0%,100%{opacity:0}50%{opacity:.6}}
.brand svg.wm{width:auto;height:15px;display:block;shape-rendering:geometricPrecision}
.wm{display:block;fill:currentColor}
.loader .word svg{height:clamp(14px,1.8vw,22px);width:auto;fill:var(--cream);display:block;margin:0 auto}
.brand .word{font-weight:300;font-size:14px;letter-spacing:.3em;text-transform:uppercase;padding-left:.3em}
.brand .word em{font-family:var(--serif);font-style:italic;text-transform:none;letter-spacing:0;font-size:1.1em;margin-left:2px}
.nav-links{display:flex;gap:30px}
.nav-links a{font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.62);transition:color .3s;position:relative;padding:6px 0}
.nav-links a::after{content:"";position:absolute;left:0;bottom:0;width:0;height:1px;background:#fff;transition:width .5s var(--ease)}
.nav-links a:hover,.nav-links a.on{color:#fff}
.nav-links a.on::after{width:100%}
.nav-right{display:flex;align-items:center;gap:18px;justify-self:end}
.nav .pill{border-color:rgba(255,255,255,.3);color:#fff}
.nav .pill:hover{background:#fff;color:#000;border-color:#fff}
.nav .pill::before{background:#fff}
.lang{display:flex;gap:8px;font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.18em}
.lang button{color:rgba(255,255,255,.5);transition:color .3s;padding:4px 0}
.lang button[aria-pressed="true"]{color:#fff}
.lang i{color:rgba(255,255,255,.25);font-style:normal}
.burger{display:none;width:40px;height:40px;position:relative}
.burger::before,.burger::after{content:"";position:absolute;left:8px;right:8px;height:1px;background:#fff;transition:transform .4s var(--ease),top .4s var(--ease)}
.burger::before{top:16px}.burger::after{top:23px}
body.menu-open .burger::before{top:20px;transform:rotate(45deg)}
body.menu-open .burger::after{top:20px;transform:rotate(-45deg)}
.menu{position:fixed;inset:0;z-index:69;background:var(--lux);background-color:var(--noir);display:none;flex-direction:column;justify-content:center;gap:16px;padding:var(--gutter)}
.menu.open{display:flex}
.menu a{font-weight:300;font-size:clamp(34px,9vw,56px);letter-spacing:-.02em;display:flex;align-items:baseline;gap:16px;color:var(--cream-2)}
.menu a i{font-family:var(--mono);font-style:normal;font-size:10px;letter-spacing:.2em;color:var(--gold)}

/* hero */
.hero{height:460vh;position:relative;padding-inline:0}
.hero-sticky{position:sticky;top:0;height:100vh;overflow:hidden;background:var(--noir)}
.hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;filter:saturate(.92) contrast(1.04)}
.hv{opacity:0;transition:opacity .45s ease}.hv.ready{opacity:1}
.hero-shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(18,18,16,.6) 0%,rgba(18,18,16,0) 26%,rgba(18,18,16,0) 48%,rgba(18,18,16,.9) 100%),linear-gradient(90deg,rgba(18,18,16,.72) 0%,rgba(18,18,16,.3) 36%,rgba(18,18,16,0) 62%)}
.hero-shade::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56%;background:linear-gradient(180deg,rgba(18,18,16,0),rgba(18,18,16,.55) 60%,rgba(18,18,16,.92));opacity:.9}
.hero-sticky::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 220px rgba(0,0,0,.6)}
.beat{position:absolute;left:var(--gutter);right:var(--gutter);z-index:2;text-shadow:0 2px 24px rgba(0,0,0,.45);opacity:0;transform:translateY(26px);transition:opacity .9s var(--ease),transform 1.1s var(--ease);pointer-events:none}
.beat.on{opacity:1;transform:none;pointer-events:auto}
.beat.off{opacity:0;transform:translateY(-22px)}
.beat.off{transition:opacity .4s var(--ease),transform .6s var(--ease)}
.beat.on{transition-delay:.28s}
.b1{bottom:clamp(36px,7vh,80px);display:grid;gap:clamp(14px,2.4vh,26px);max-width:min(92vw,1100px)}
.b1 .label{color:var(--cream-2)}
.hero-title{text-align:left}
.hero-title .giant{font-size:min(9vw,15.5vh);display:block;line-height:.92;text-align:left}
.hero-title .giant .it{display:block;font-size:.8em;white-space:nowrap;color:var(--cream-2);line-height:1.05;opacity:0;transform:translateY(16px);transition:opacity 1s var(--ease),transform 1.2s var(--ease)}
.b1.it-on .hero-title .giant .it{opacity:1;transform:none}
.hero-title .giant .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em;margin-bottom:-.08em}
.hero-title .giant .w i{display:inline-block;font-style:inherit;transform:translateY(110%);transition:transform 1.2s var(--ease)}
.loaded .hero-title .giant .w i{transform:none}
.bx .line{font-size:min(6.2vw,10.5vh);line-height:.98;margin:0}
.bx .line .cap{display:block}
.bx .line .it{display:block;font-family:var(--serif);font-style:italic;font-weight:400;text-transform:none;letter-spacing:-.01em;color:var(--cream-2);font-size:.8em;line-height:1.05}
.b2,.b4{top:50%;transform:translateY(calc(-50% + 26px));max-width:min(70vw,980px)}
.b2.on,.b4.on{transform:translateY(-50%)}
.b2.off,.b4.off{transform:translateY(calc(-50% - 22px))}
.b3{top:50%;left:auto;right:var(--gutter);text-align:right;transform:translateY(calc(-50% + 26px));max-width:min(60vw,900px)}
.b3.on{transform:translateY(-50%)}
.b3.off{transform:translateY(calc(-50% - 22px))}
.b5{bottom:clamp(36px,7vh,80px);display:grid;gap:clamp(16px,2.6vh,28px);max-width:min(92vw,900px)}
.b5 .sub{font-size:clamp(15px,1.2vw,18px);line-height:1.5;color:var(--cream-2);max-width:34em;margin:0}
.cta-row{display:flex;gap:clamp(16px,2vw,32px);align-items:center;flex-wrap:wrap}
/* viseur caméra (backstage) */
.vf{position:absolute;inset:0;z-index:3;pointer-events:none;color:rgba(243,241,234,.78);font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;--m:clamp(18px,2.4vw,34px);--t:calc(var(--nav) + 10px)}
.vf .vc{position:absolute;width:26px;height:26px;border:0 solid rgba(243,241,234,.7)}
.vf .tl{left:var(--m);top:var(--t);border-left-width:1px;border-top-width:1px}
.vf .tr{right:var(--m);top:var(--t);border-right-width:1px;border-top-width:1px}
.vf .bl{left:var(--m);bottom:var(--m);border-left-width:1px;border-bottom-width:1px}
.vf .br{right:var(--m);bottom:var(--m);border-right-width:1px;border-bottom-width:1px}
.vf .vsafe{position:absolute;left:calc(var(--m) + 7%);right:calc(var(--m) + 7%);top:calc(var(--t) + 6%);bottom:calc(var(--m) + 6%);border:1px dashed rgba(243,241,234,.12)}
.vf .vtop{position:absolute;left:calc(var(--m) + 40px);top:calc(var(--t) + 6px);display:flex;gap:18px;align-items:center}
.vf .rec{display:flex;align-items:center;gap:8px;color:#F3F1EA}
.vf .rec b{width:8px;height:8px;border-radius:50%;background:#E5483A;box-shadow:0 0 10px rgba(229,72,58,.8);animation:recb 1.2s steps(1) infinite}
@keyframes recb{50%{opacity:.15}}
.vf .tc{font-variant-numeric:tabular-nums;color:#F3F1EA;letter-spacing:.2em}
.vf .vsep{color:rgba(243,241,234,.45)}
.vf .vtopr{position:absolute;right:calc(var(--m) + 40px);top:calc(var(--t) + 6px);display:flex;gap:18px;align-items:center}
.vf .bat{width:22px;height:10px;border:1px solid rgba(243,241,234,.7);border-radius:2px;position:relative}
.vf .bat::after{content:"";position:absolute;right:-4px;top:2px;width:2px;height:4px;background:rgba(243,241,234,.7)}
.vf .bat i{position:absolute;left:1px;top:1px;bottom:1px;width:68%;background:#C99B45}
.vf .vcross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);opacity:.45}
.vf .vcross::before,.vf .vcross::after{content:"";position:absolute;background:rgba(243,241,234,.9)}
.vf .vcross::before{left:50%;top:0;bottom:0;width:1px}.vf .vcross::after{top:50%;left:0;right:0;height:1px}
.vf .vfocus{position:absolute;left:var(--fx,64%);top:var(--fy,40%);width:clamp(90px,10vw,150px);height:clamp(70px,8vw,120px);transform:translate(-50%,-50%);transition:left 1.2s var(--ease),top 1.2s var(--ease),width .8s var(--ease),height .8s var(--ease)}
.vf .vfocus i{position:absolute;width:12px;height:12px;border:0 solid rgba(243,241,234,.85);transition:border-color .4s}
.vf .vfocus i:nth-child(1){left:0;top:0;border-left-width:1.5px;border-top-width:1.5px}
.vf .vfocus i:nth-child(2){right:0;top:0;border-right-width:1.5px;border-top-width:1.5px}
.vf .vfocus i:nth-child(3){left:0;bottom:0;border-left-width:1.5px;border-bottom-width:1.5px}
.vf .vfocus i:nth-child(4){right:0;bottom:0;border-right-width:1.5px;border-bottom-width:1.5px}
.vf .vfocus span{position:absolute;left:0;top:-16px;font-size:9px;letter-spacing:.2em;color:rgba(243,241,234,.8)}
.vf .vfocus.lock i{border-color:#C99B45}.vf .vfocus.lock span{color:#C99B45}
.vf .vbot{position:absolute;left:50%;bottom:calc(var(--m) + 4px);transform:translateX(-50%);display:flex;gap:22px;color:rgba(243,241,234,.62)}
.vf .vaud{position:absolute;left:calc(var(--m) + 40px);bottom:calc(var(--m) + 4px);display:grid;grid-template-columns:auto 90px;gap:5px 10px;align-items:center;font-size:8.5px;color:rgba(243,241,234,.55)}
.vf .vaud .m{height:3px;background:rgba(243,241,234,.15);position:relative;overflow:hidden}
.vf .vaud .m i{position:absolute;left:0;top:0;bottom:0;width:60%;background:linear-gradient(90deg,#9FBF7A 0 70%,#C99B45 70% 88%,#E5483A 88%);transform-origin:0 50%;animation:vu .9s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes vu{0%{transform:scaleX(.35)}40%{transform:scaleX(.8)}70%{transform:scaleX(.5)}100%{transform:scaleX(.95)}}
.hero-meta{z-index:4}
.beat{z-index:4}
@media (max-width:900px),(orientation:portrait) and (max-width:1180px),(orientation:landscape) and (max-width:1000px) and (max-height:560px){.vf{font-size:8.5px;--m:12px}.vf .vbot,.vf .vaud,.vf .vsep,.vf .vtopr span:nth-child(2){display:none}.vf .vsafe{display:none}.vf .vtop{left:calc(var(--m) + 30px)}.vf .vtopr{right:calc(var(--m) + 30px)}}
@media (prefers-reduced-motion:reduce){.vf .rec b,.vf .vaud .m i{animation:none}}
.hero-meta{position:absolute;right:var(--gutter);bottom:clamp(22px,4vh,40px);z-index:2;display:flex;gap:28px;align-items:center;color:var(--cream-3)}
.hero-meta .tc{font-variant-numeric:tabular-nums;letter-spacing:.2em;color:var(--cream-2)}
.gen{padding-block:clamp(40px,6vh,72px) clamp(56px,9vh,110px)}
.gen-k{justify-self:end;align-self:start;color:var(--fg-3)}
.hero-foot{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr) minmax(0,1fr);gap:clamp(20px,3vw,56px);align-items:start;border-top:1px solid var(--line);padding-top:clamp(18px,2.6vh,28px)}
.hero-foot>*{min-width:0}
.hero-foot .body{max-width:30em;font-size:14.5px}
.hero-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2vw,32px)}
.hero-list a{display:grid;gap:8px;color:var(--fg);padding-left:14px;border-left:1px solid var(--line);transition:border-color .5s var(--ease)}
.hero-list a:hover{border-color:var(--gold)}
.hero-list .n{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--fg-3)}
.hero-list .t{font-weight:400;font-size:14.5px;line-height:1.35}
.hero-list .m{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3)}
.scrollhint{justify-self:end;display:flex;align-items:center;gap:10px;white-space:nowrap}
.scrollhint i{width:28px;height:28px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-style:normal;color:var(--fg);animation:hint 2.4s var(--ease) infinite}
@keyframes hint{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.hero-fade{opacity:0;transform:translateY(16px);transition:opacity 1.2s var(--ease) .6s,transform 1.2s var(--ease) .6s}
.loaded .hero-fade{opacity:1;transform:none}

/* bande défilante */


/* le studio : stats + texte qui se révèle */
.studio{display:block;padding-block:clamp(72px,12vh,150px) clamp(96px,16vh,200px)}
.facts{border-bottom:1px solid var(--line)}
.fact{position:relative;display:grid;grid-template-columns:clamp(40px,5vw,80px) minmax(0,1fr) minmax(0,22em);gap:clamp(16px,3vw,56px);align-items:baseline;padding-block:clamp(18px,3vh,32px)}
.fact::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--line);transform:scaleX(0);transform-origin:0 50%;transition:transform 1.4s var(--ease)}
.fact.in::before{transform:none}
.fact .fi{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--gold);opacity:0;transition:opacity .8s var(--ease) .2s}
.fact .fw{display:block;overflow:hidden;padding-bottom:.08em}
.fact .m{display:inline-block;white-space:nowrap;font-weight:200;font-size:clamp(34px,5.4vw,96px);line-height:.95;letter-spacing:-.03em;text-transform:uppercase;color:var(--fg);transform:translateY(105%);transition:transform 1.3s var(--ease) .1s}
.fact .m em{font-family:var(--serif);font-style:italic;font-weight:400;text-transform:none;letter-spacing:-.02em;color:var(--gold);margin-right:.08em;transition:color .6s var(--ease)}
.fact .fd{font-size:14px;line-height:1.55;color:var(--fg-3);opacity:0;transform:translateY(10px);transition:opacity 1s var(--ease) .45s,transform 1s var(--ease) .45s,color .4s}
.fact.in .fi{opacity:1}.fact.in .m{transform:none}.fact.in .fd{opacity:1;transform:none}
.fact:hover .m em{color:#F4E1A6}.fact:hover .fd{color:var(--fg-2)}
.facts:hover .fact:not(:hover) .m{color:var(--fg-3)}
.fact .m{transition:transform 1.3s var(--ease) .1s,color .5s var(--ease)}
.studio-body{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:clamp(32px,6vw,120px);padding-top:clamp(52px,8vh,96px);align-items:stretch}
.studio-body>*{min-width:0}
.sleft{display:flex;flex-direction:column;align-items:flex-start;gap:18px;padding-top:8px}
.sleft .paren{padding-top:0}
.srule{display:block;width:44px;height:1px;background:var(--gold)}
.sleft .aside{margin:auto 0 0;grid-column:auto;font-size:15px;line-height:1.65;color:var(--fg-2);max-width:22em}
.ssig{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-style:italic;font-size:17px;color:var(--fg)}
.ssig svg{width:22px;height:20px}
.reveal{font-weight:300;font-size:clamp(28px,3.2vw,52px);line-height:1.14;letter-spacing:-.02em;max-width:17em;margin:0}
.reveal .w{color:var(--fg-3);transition:none}
.reveal .w.on{color:var(--fg)}
.aside{grid-column:2;margin-top:clamp(32px,5vh,56px);margin-left:clamp(0px,10vw,160px);color:var(--fg-2);font-size:15px;max-width:26em;line-height:1.6}

/* voir : films en bande horizontale */
.voir{overflow:hidden}
.voir-pin{position:relative;height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-top:calc(var(--nav) + 8px);padding-bottom:20px}
.voir-head{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--line);padding-bottom:12px}
.vstage{position:relative;min-height:0;perspective:1600px;perspective-origin:50% 30%}
.wtitle{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);margin:0;text-align:center;font-size:clamp(48px,9vw,160px);z-index:3;pointer-events:none;white-space:nowrap}
.wtitle .it{display:inline;font-size:.8em}
.wall{position:absolute;inset:12px 0;display:grid;place-items:center;transform-style:preserve-3d}
.vgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--g,14px);width:var(--gw,100%);transform-style:preserve-3d;will-change:transform}
.card{position:relative;min-width:0;transform-style:preserve-3d}
.card .vid{position:relative;aspect-ratio:16/9;background:#0d0d0c;overflow:hidden;border-radius:7px;cursor:pointer;box-shadow:0 18px 40px -18px rgba(0,0,0,.45);transition:transform .7s var(--ease),filter .7s var(--ease),opacity .7s var(--ease)}
.card .vid video,.card .vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.card .vid video{opacity:0;transition:opacity .8s var(--ease)}
.card .vid.playing video{opacity:1}
.card .vid .tag{position:absolute;left:10px;top:10px;font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:#F0ECE6;padding:3px 7px;border:1px solid rgba(240,236,230,.35);background:rgba(0,0,0,.35);opacity:0;transition:opacity .5s}
.card .cap{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline;padding:28px 12px 10px;background:linear-gradient(180deg,rgba(10,10,9,0),rgba(10,10,9,.82));color:#F0ECE6;opacity:0;transform:translateY(6px);transition:opacity .5s var(--ease),transform .6s var(--ease);pointer-events:none}
.card .cap .n{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--gold)}
.card .cap .t{font-size:clamp(11px,.9vw,14px);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cap .s{grid-column:2;font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:rgba(240,236,230,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card:hover .cap,.card:focus-within .cap{opacity:1;transform:none}
.card:hover .vid .tag{opacity:1}
.card:hover .vid{transform:translateZ(40px) scale(1.06);z-index:2}
.card .num-badge{display:none}
/* anneau 3D (desktop) */
.voir.ring3d .vstage{perspective:2400px;perspective-origin:50% 40%}
.voir.ring3d .wall{position:absolute;inset:0;display:block}
.voir.ring3d .vgrid{position:absolute;left:50%;top:var(--wy,54%);width:0!important;height:0;display:block;transform-style:preserve-3d;will-change:transform}
.voir.ring3d .card{position:absolute;left:calc(var(--cw) * -.5);top:calc(var(--ch) * -.5);width:var(--cw);will-change:transform;transform-style:preserve-3d}
.voir.ring3d .wtitle{position:absolute;left:0;top:0;right:auto;width:max-content;transform:translate(-50%,-50%) translateZ(calc(var(--R) * -1));white-space:nowrap;z-index:auto;font-size:clamp(28px,3.3vw,62px)}
.voir.ring3d .card .vid{box-shadow:0 20px 50px -20px rgba(0,0,0,.4)}
.voir.ring3d:not(.grid) .card:hover .vid{transform:none}
.voir.ring3d .card.back .vid,.voir.ring3d .card.back:hover .vid{transform:scaleX(-1);filter:brightness(.62) saturate(.8)}
.voir.ring3d:not(.grid) .card .cap,.voir.ring3d:not(.grid) .card .vid .tag{display:none}
.vfront{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);display:flex;gap:14px;align-items:baseline;pointer-events:none;opacity:0;transition:opacity .5s;white-space:nowrap}
.voir.ring3d:not(.grid) .vfront.on{opacity:1}
.vfront .n{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--gold)}
.vfront .t{font-weight:400;font-size:clamp(14px,1.2vw,18px);letter-spacing:.04em;text-transform:uppercase}
.vfront .s{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--fg-3)}
.voir:not(.ring3d) .vfront{display:none}
/* ruban 3D façon trionn (desktop) */
.rscene{display:none}
.voir.ribbon .vstage{perspective:var(--P,900px);perspective-origin:50% 50%}
.voir.ribbon .rscene{display:block;position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none;z-index:1}
.rworld{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.rring{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.rcard{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.rring canvas{transform-origin:50% 50%;will-change:transform;contain:strict}
.rring canvas{max-width:none;max-height:none;position:absolute;left:calc(var(--sw) * -.5);top:calc(var(--ch) * -.5);width:var(--sw);height:var(--ch);display:block;backface-visibility:visible;background:transparent}
.rring canvas.l{border-radius:7px 0 0 7px}.rring canvas.r{border-radius:0 7px 7px 0}
.rcard.back canvas{filter:brightness(.78)}
.rt{position:absolute;left:50%;top:50%;margin:0;white-space:nowrap;font-weight:300;font-size:clamp(40px,5.6vw,100px);line-height:1;letter-spacing:-.03em;text-transform:uppercase;color:var(--fg);will-change:transform}
.rt2 em{font-family:var(--serif);font-style:italic;font-weight:400;text-transform:none;letter-spacing:-.02em;color:var(--fg-2)}
.voir.ribbon .wtitle{display:none}
.voir.ribbon .wall{position:absolute;inset:0;display:grid;place-items:center;z-index:2}
.voir.ribbon .vgrid{width:var(--gw,60%)}
.voir.ribbon .card{opacity:0}
.voir.ribbon:not(.grid) .vgrid{pointer-events:none}
.voir.ribbon .vfront{display:none}
/* grille statique (mobile, reduced motion) */
.voir.flat .voir-pin{height:auto;gap:20px;padding-bottom:40px}
.voir.flat .vstage{perspective:none}
.voir.flat .wtitle{grid-column:1/-1;position:static;transform:none;white-space:normal;text-align:left;font-size:clamp(44px,8vw,120px);margin:0 0 18px}
.voir.flat .wall{position:static}
.voir.flat .vgrid{width:100%;transform:none!important}
.voir.flat .card{transform:none!important;opacity:1!important}
.voir.flat .card .cap{position:static;opacity:1;transform:none;background:none;color:var(--fg);padding:8px 0 0}
.voir.flat .card .cap .s{color:var(--fg-3)}
.voir-foot{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,5fr) auto;gap:clamp(20px,3vw,48px);align-items:center;border-top:1px solid var(--line);padding-top:16px}
.voir-foot .voir-meta{font-size:13.5px;color:var(--fg-2);max-width:40em;line-height:1.5;margin:0}
.vprog{height:1px;background:var(--line);position:relative}
.vprog i{position:absolute;left:0;top:-1px;height:3px;width:var(--p,0%);background:var(--gold);transition:width .2s linear}

/* méthode */
.method{padding-block:clamp(72px,12vh,140px) clamp(72px,12vh,140px)}
.method-head .top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}
.method-head .top .body{max-width:26em;text-align:left}
.method-head .giant{margin-top:clamp(32px,6vh,72px);display:flex;align-items:baseline;gap:.1em;flex-wrap:wrap;font-size:clamp(48px,9vw,150px)}
.method-head .giant .la{font-family:var(--serif);font-style:italic;font-weight:400;text-transform:none;letter-spacing:-.02em;color:var(--fg-2);font-size:.55em}

.method.mstage .mlist{position:relative;height:min(46vh,440px)}

/* formats : liste qui s'allume */

.fcard2{position:relative;display:flex;flex-direction:column;background:#F3F1EA;border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:transform .8s var(--ease),box-shadow .8s var(--ease),border-color .5s;opacity:0;transform:translateY(40px)}

.fx-wrap::after{display:none}
.fx{position:absolute;inset:0;width:100%;height:100%;color:#121210;overflow:visible}
.fcard2.feat .fx{color:#EFEDE6}

@keyframes fxdraw{to{stroke-dashoffset:0}}

/* Signal : une idée qui éclot, une durée courte */
.fx-sig .ring{fill:none;stroke:#C99B45;stroke-width:1;opacity:0;transform-origin:160px 83px}
.fcard2.in .fx-sig .ring{animation:fxring 3.2s cubic-bezier(.2,.7,.2,1) 1.2s infinite}

.fcard2.in .fx-sig .tlf{animation:fxbar 3.2s cubic-bezier(.6,0,.2,1) 1.2s infinite}
@keyframes fxbar{0%{stroke-dashoffset:53}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-53;opacity:0}}
/* Portrait : trois temps, une voix */

.fcard2.in .fx-por .a1{animation-delay:1.2s}.fcard2.in .fx-por .a2{animation-delay:1.9s}.fcard2.in .fx-por .a3{animation-delay:2.6s}
@keyframes fxact{0%{opacity:0;transform:translateY(6px)}10%,78%{opacity:1;transform:none}92%,100%{opacity:0;transform:translateY(-4px)}}
.fx-por .wave rect{fill:#C99B45;transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(.2)}

@keyframes fxwave{0%{transform:scaleY(.2)}100%{transform:scaleY(1)}}
/* Campagne : un film qui se décline */
.fx-cam .c1,.fx-cam .c2,.fx-cam .c3,.fx-cam .c4{opacity:0;transform:translate(-30px,0) scale(.9);transform-box:fill-box;transform-origin:50% 50%}
.fcard2.in .fx-cam .c1,.fcard2.in .fx-cam .c2,.fcard2.in .fx-cam .c3,.fcard2.in .fx-cam .c4{animation:fxcut 6.5s cubic-bezier(.2,.8,.2,1) infinite}
.fcard2.in .fx-cam .c1{animation-delay:1.4s}.fcard2.in .fx-cam .c2{animation-delay:1.7s}.fcard2.in .fx-cam .c3{animation-delay:1.95s}.fcard2.in .fx-cam .c4{animation-delay:2.2s}
@keyframes fxcut{0%{opacity:0;transform:translate(-30px,0) scale(.9)}12%,80%{opacity:1;transform:none}94%,100%{opacity:0;transform:translate(10px,0) scale(.96)}}
.fx-cam .lang rect{fill:none;stroke:#C99B45;stroke-opacity:.8}
.fx-cam .lang text{font-size:7.5px;fill:#C99B45;fill-opacity:1}
.fx-cam .en1{opacity:0}
.fcard2.in .fx-cam .fr1{animation:fxfr 3s steps(1) 1.4s infinite}
.fcard2.in .fx-cam .en1{animation:fxen 3s steps(1) 1.4s infinite}
@keyframes fxfr{0%{opacity:1}50%{opacity:0}}
@keyframes fxen{0%{opacity:0}50%{opacity:1}}
.fcard2:hover .fx .fr{stroke-opacity:.9}
@media (prefers-reduced-motion:reduce){.fx *{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}
