<script>document.addEventListener('DOMContentLoaded',function(){
(function(){
  var d=document, root=d.documentElement, body=d.body;
  var reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var fine=matchMedia('(hover: hover) and (pointer: fine)').matches;
  function compact(){return matchMedia('(max-width:900px),(orientation:portrait) and (max-width:1180px),(orientation:landscape) and (max-width:1000px) and (max-height:560px)').matches;}
  /* rotation d'écran : si la mise en page change (tablette, téléphone en paysage), on recharge proprement */
  (function(){var c0=compact(),t;addEventListener('resize',function(){clearTimeout(t);t=setTimeout(function(){if(compact()!==c0)location.reload();},350);});})();
  var hasGsap=!!(window.gsap&&window.ScrollTrigger);
  if(hasGsap) gsap.registerPlugin(ScrollTrigger);
  if(hasGsap) ScrollTrigger.config({ignoreMobileResize:true});
  var MARK=@@MARK@@;
  var pad=function(n){return (n<10?'0':'')+n;};
  var clamp=function(x){return Math.min(1,Math.max(0,x));};

  /* ---------- défilement doux ---------- */
  var lenis=null;
  (function(){var nv=document.getElementById('nav');if(!nv)return;var st=false;function chk(){var y=window.scrollY||document.documentElement.scrollTop||0,on=y>24;if(on!==st){st=on;nv.classList.toggle('solid',on);}}addEventListener('scroll',chk,{passive:true});chk();})();
  if(window.Lenis&&!reduced){
    lenis=new Lenis({lerp:.09,smoothWheel:true});
        if(hasGsap){lenis.on('scroll',ScrollTrigger.update);gsap.ticker.add(function(t){lenis.raf(t*1000);});gsap.ticker.lagSmoothing(0);}
    else{(function raf(t){lenis.raf(t);requestAnimationFrame(raf);})(0);}
  }
  function scrollTo(target,opts){opts=opts||{};if(opts.immediate){window.scrollTo(0,typeof target==='number'?target:target.getBoundingClientRect().top+window.scrollY+(opts.offset||0));}if(lenis){lenis.scrollTo(target,{immediate:!!opts.immediate,force:true,offset:opts.offset||0,duration:1.2});}else if(!opts.immediate){var y=typeof target==='number'?target:target.getBoundingClientRect().top+window.scrollY+(opts.offset||0);window.scrollTo({top:y,behavior:'smooth'});}}

  /* ---------- langue ---------- */
  var LANGS=['fr','en'], lang='fr';
  function applyLang(scope){(scope||body).querySelectorAll('[lang]').forEach(function(el){var v=el.getAttribute('lang');if(LANGS.indexOf(v)>-1)el.hidden=(v!==lang);});}
  function setLang(l){lang=(LANGS.indexOf(l)>-1)?l:'fr';applyLang();root.lang=lang;d.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.lang===lang));});if(!PATHMODE)try{localStorage.setItem('a8-lang',lang);}catch(e){}if(typeof syncVer==='function')try{syncVer();}catch(e){}}
  /* URL propres (/films/, /en/faq/…) en ligne ; ancres #vue en local (fichier .html) */
  var SEO=@@SEO@@, PATHMODE=/^https?:$/.test(location.protocol)&&!/\.html$/.test(location.pathname);
  function pathView(){var p=location.pathname.replace(/^\/en(?=\/|$)/,'').replace(/^\/+|\/+$/g,'');return p||'accueil';}
  if(PATHMODE){lang=/^\/en(\/|$)/.test(location.pathname)?'en':'fr';}else{try{lang=localStorage.getItem('a8-lang')||'fr';}catch(e){}}
  d.querySelectorAll('.lang button').forEach(function(b){b.addEventListener('click',function(){setLang(b.dataset.lang);if(typeof pushHash==='function'&&typeof cur!=='undefined')pushHash(cur,true);if(hasGsap)ScrollTrigger.refresh();});});
  setLang(lang);

  /* ---------- le 八 en deux dimensions (chargeur, rideau) ---------- */
  function polyD(p){return 'M'+p.map(function(q){return q[0]+' '+q[1];}).join(' L ');}
  function ptAt(p,t){var i=Math.min(p.length-1,Math.max(0,Math.round(t*(p.length-1))));return p[i];}
  function buildMark(host,u,white){
    var g=MARK.GH;
    var stops=white?'<stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#F3F1EA"/><stop offset="1" stop-color="#CFCBC0"/>':'<stop offset="0" stop-color="#8C6A2A"/><stop offset=".32" stop-color="#F4E1A6"/><stop offset=".6" stop-color="#C99B45"/><stop offset="1" stop-color="#7C5B22"/>';
    var glow=white?'#FFFFFF':'#E8A33F', tipH=white?'#FFFFFF':'#F6C760', tip=white?'#FFFFFF':'#FFF3C8';
    var defs='<linearGradient id="g'+u+'" gradientUnits="userSpaceOnUse" x1="0" y1="-'+g+'" x2="0" y2="'+g+'">'+stops+'</linearGradient>'+
      '<filter id="b'+u+'" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>'+
      '<filter id="c'+u+'" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>'+
      '<mask id="m1'+u+'" maskUnits="userSpaceOnUse" x="-130" y="-130" width="260" height="260"><path id="mp1'+u+'" d="'+polyD(MARK.CL)+'" pathLength="1" fill="none" stroke="#fff" stroke-width="44" stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="1"/></mask>'+
      '<mask id="m2'+u+'" maskUnits="userSpaceOnUse" x="-130" y="-130" width="260" height="260"><path id="mp2'+u+'" d="'+polyD(MARK.CR)+'" pathLength="1" fill="none" stroke="#fff" stroke-width="44" stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="1"/></mask>';
    host.innerHTML='<svg viewBox="-110 -110 220 220" aria-hidden="true"><defs>'+defs+'</defs>'+
      '<g id="gl'+u+'" opacity="0"><path d="'+MARK.DL+'" fill="'+glow+'" opacity="'+(white?'.35':'.5')+'" mask="url(#m1'+u+')" filter="url(#b'+u+')"/><path d="'+MARK.DR+'" fill="'+glow+'" opacity="'+(white?'.35':'.5')+'" mask="url(#m2'+u+')" filter="url(#b'+u+')"/></g>'+
      '<g mask="url(#m1'+u+')"><path d="'+MARK.DL+'" fill="url(#g'+u+')" fill-rule="evenodd"/></g><g mask="url(#m2'+u+')"><path d="'+MARK.DR+'" fill="url(#g'+u+')" fill-rule="evenodd"/></g>'+
      '<circle id="t1h'+u+'" r="12" fill="'+tipH+'" opacity="0" filter="url(#c'+u+')"/><circle id="t1'+u+'" r="2.4" fill="'+tip+'" opacity="0"/><circle id="t2h'+u+'" r="12" fill="'+tipH+'" opacity="0" filter="url(#c'+u+')"/><circle id="t2'+u+'" r="2.4" fill="'+tip+'" opacity="0"/></svg>';
    var q=function(id){return host.querySelector('#'+id+u);};
    return {m1:q('mp1'),m2:q('mp2'),gl:q('gl'),t1:q('t1'),t1h:q('t1h'),t2:q('t2'),t2h:q('t2h')};
  }
  var brush=function(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
  function setMark(m,t){
    var p1=brush(clamp((t-.04)/.46)), p2=brush(clamp((t-.42)/.52));
    m.m1.setAttribute('stroke-dashoffset',String(1-p1)); m.m2.setAttribute('stroke-dashoffset',String(1-p2));
    m.gl.setAttribute('opacity',String(Math.sin(Math.PI*clamp((t-.08)/.92))*.6));
    var a=ptAt(MARK.CL,p1), b=ptAt(MARK.CR,p2), a1=(p1>0&&p1<.985)?1:0, a2=(p2>0&&p2<.985)?1:0;
    m.t1.setAttribute('cx',a[0]);m.t1.setAttribute('cy',a[1]);m.t1.setAttribute('opacity',a1);m.t1h.setAttribute('cx',a[0]);m.t1h.setAttribute('cy',a[1]);m.t1h.setAttribute('opacity',a1*.5);
    m.t2.setAttribute('cx',b[0]);m.t2.setAttribute('cy',b[1]);m.t2.setAttribute('opacity',a2);m.t2h.setAttribute('cx',b[0]);m.t2h.setAttribute('cy',b[1]);m.t2h.setAttribute('opacity',a2*.5);
  }
  function playMark(m,dur){return new Promise(function(res){if(reduced){setMark(m,1);return res();}var t0=null;function step(ts){if(t0===null)t0=ts;var t=clamp((ts-t0)/dur);setMark(m,t);if(t<1)requestAnimationFrame(step);else res();}setMark(m,0);requestAnimationFrame(step);});}

  /* ---------- le 八 en volume ---------- */
  var three=null;
  function initHero3D(){
    var host=d.getElementById('hero3d'); if(!host)return;
    function fallback(){host.innerHTML='<div class="fallback"><svg viewBox="0 0 220 220"><use href="#ba"/></svg></div>';}
    if(!window.THREE){fallback();return;}
    var renderer; try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});}catch(e){fallback();return;}
    if(!renderer.getContext()){fallback();return;}
    renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
    renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
    renderer.setClearColor(0x000000,0);
    host.appendChild(renderer.domElement);
    var scene=new THREE.Scene();
    var cam=new THREE.PerspectiveCamera(30,1,1,3000); cam.position.set(0,0,520);
    /* environnement : un studio sombre avec deux boîtes à lumière */
    var c=d.createElement('canvas'); c.width=1024; c.height=512; var x=c.getContext('2d');
    var gr=x.createLinearGradient(0,0,0,512); gr.addColorStop(0,'#2a2622'); gr.addColorStop(.5,'#0c0b0a'); gr.addColorStop(1,'#050505'); x.fillStyle=gr; x.fillRect(0,0,1024,512);
    function box(cx,cy,w,h,col,a){var g2=x.createRadialGradient(cx,cy,2,cx,cy,Math.max(w,h));g2.addColorStop(0,'rgba('+col+','+a+')');g2.addColorStop(1,'rgba('+col+',0)');x.fillStyle=g2;x.fillRect(cx-w,cy-h,w*2,h*2);}
    box(300,120,260,120,'255,244,214',.95); box(780,200,200,90,'255,230,190',.6); box(560,420,320,60,'120,100,70',.35); box(60,300,120,200,'255,255,255',.18);
    var tex=new THREE.CanvasTexture(c); tex.mapping=THREE.EquirectangularReflectionMapping; tex.encoding=THREE.sRGBEncoding;
    var pm=new THREE.PMREMGenerator(renderer); pm.compileEquirectangularShader(); var env=pm.fromEquirectangular(tex).texture; pm.dispose(); tex.dispose();
    var mat=new THREE.MeshStandardMaterial({color:0xC99B45,metalness:.92,roughness:.3,envMap:env,envMapIntensity:1.25});
    var group=new THREE.Group();
    [MARK.PL,MARK.PR].forEach(function(polys){
      var shape=new THREE.Shape(polys[0].map(function(p){return new THREE.Vector2(p[0],p[1]);}));
      polys.slice(1).forEach(function(h){shape.holes.push(new THREE.Path(h.map(function(p){return new THREE.Vector2(p[0],p[1]);})));});
      var geo=new THREE.ExtrudeGeometry(shape,{depth:18,bevelEnabled:true,bevelThickness:1.8,bevelSize:1.4,bevelSegments:3,curveSegments:4});
      geo.translate(0,0,-9);
      group.add(new THREE.Mesh(geo,mat));
    });
    scene.add(group);
    scene.add(new THREE.HemisphereLight(0xfff1d6,0x1a1410,.35));
    var key=new THREE.DirectionalLight(0xffe9c2,1.1); key.position.set(-180,220,300); scene.add(key);
    var rim=new THREE.DirectionalLight(0xfff8e8,.7); rim.position.set(260,-120,-200); scene.add(rim);
    var W=1,H=1, mx=0,my=0, tx=0,ty=0, spin=0, running=true, scrollRot=0;
    function size(){W=host.clientWidth||1;H=host.clientHeight||1;renderer.setSize(W,H,false);cam.aspect=W/H;cam.updateProjectionMatrix();var s=Math.min(1,(W/H)*1.05);group.scale.setScalar(s*(W>900?.74:.9));group.position.y=W>900?24:0;}
    size(); addEventListener('resize',size);
    if(fine&&!reduced){addEventListener('mousemove',function(e){mx=(e.clientX/innerWidth-.5)*2;my=(e.clientY/innerHeight-.5)*2;},{passive:true});}
    var last=0;
    function tick(ts){
      requestAnimationFrame(tick);
      if(!running)return;
      var dt=Math.min(.05,(ts-last)/1000||.016); last=ts;
      spin+=dt*(reduced?0:.28);
      tx+=(mx*.45-tx)*.05; ty+=(my*.3-ty)*.05;
      group.rotation.y=spin+tx+scrollRot; group.rotation.x=-.08+ty*-1; group.rotation.z=.04;
      renderer.render(scene,cam);
    }
    requestAnimationFrame(tick);
    three={setRunning:function(v){running=v;},setScroll:function(p){scrollRot=p*1.4;}};
    if('IntersectionObserver' in window){new IntersectionObserver(function(es){es.forEach(function(e){running=e.isIntersecting&&d.querySelector('.view.on').dataset.view==='accueil';});},{threshold:0}).observe(host);}
  }

  /* ---------- vidéos : lecture quand visibles, plein écran au clic ---------- */
  var lb=d.getElementById('lb'), lbv=d.getElementById('lbVideo'), lbc=d.getElementById('lbCap');
  var lbVer=d.getElementById('lbVer'),lbAlt=null;
  function lbSet(v){if(!lbAlt)return;lbAlt.v=v;lbVer.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===v));});}
  if(lbVer)lbVer.addEventListener('click',function(e){var b=e.target.closest('button');if(!b||!lbAlt||b.dataset.v===lbAlt.v)return;var t=lbv.currentTime||0;lbSet(b.dataset.v);lbv.src=lbAlt[b.dataset.v];lbv.addEventListener('loadedmetadata',function f(){lbv.removeEventListener('loadedmetadata',f);try{lbv.currentTime=Math.min(t,(lbv.duration||t)-.1);}catch(_){}lbv.play().catch(function(){});});});
  function openLb(src,title,demo,alt){if(window.a8track)a8track('video_open',{video_title:title||''});lbAlt=alt||null;if(lbVer)lbVer.hidden=!alt;if(alt){lbSet(alt.v);src=alt[alt.v];}lbv.src=src;lbc.textContent=title||'';if(demo){var t=d.createElement('span');t.className='lb-demo';var en=(d.documentElement.lang==='en');t.textContent=demo==='concept'?(en?'Concept · unofficial demo':'Concept · démo non officielle'):(en?'Agency demo · not approved by the client':'Démo agence · non validée par le client');lbc.appendChild(t);}lb.classList.add('show');requestAnimationFrame(function(){requestAnimationFrame(function(){lb.classList.add('open');});});lbv.muted=false;lbv.play().catch(function(){});if(lenis)lenis.stop();}
  var srVid=d.getElementById('srVid'),srMan=false;
  function srSet(v){if(!srVid)return;if(srVid.dataset.v===v)return;srVid.dataset.v=v;var src=v==='en'?srVid.dataset.srcEn:srVid.dataset.src,vid=srVid.querySelector('video'),img=srVid.querySelector('img');if(img)img.src=src.replace('.mp4','.jpg');if(vid){var pl=!vid.paused;srVid.classList.remove('playing');vid.src=src;if(pl)vid.play().then(function(){srVid.classList.add('playing');}).catch(function(){});}var g=srVid.closest('.film').querySelector('.ver');if(g)g.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===v));});}
  function syncVer(){if(!srMan)srSet(lang);}
  if(srVid){var srG=srVid.closest('.film').querySelector('.ver');if(srG)srG.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;srMan=true;srSet(b.dataset.v);});syncVer();}
  function closeLb(){if(!lb.classList.contains('open'))return;lb.classList.remove('open');lbv.pause();setTimeout(function(){lb.classList.remove('show');lbv.removeAttribute('src');lbv.load();},460);if(lenis)lenis.start();}
  d.getElementById('lbClose').addEventListener('click',closeLb);
  lb.addEventListener('click',function(e){if(e.target===lb)closeLb();});
  var vio=('IntersectionObserver' in window)?new IntersectionObserver(function(es){es.forEach(function(e){var v=e.target.querySelector('video');if(!v)return;if(e.isIntersecting&&!reduced){v.preload='auto';v.play().then(function(){e.target.classList.add('playing');}).catch(function(){});}else{v.pause();}});},{threshold:.25}):null;
  d.querySelectorAll('.vid').forEach(function(m){
    if(vio&&!m.closest('#voir'))vio.observe(m);
    m.addEventListener('click',function(){if(Date.now()-(lastMove||0)<350)return;openLb(m.dataset.src,m.dataset.title,m.querySelector('.tag.demo')?'demo':(m.querySelector('.tag.concept')?'concept':''),m.dataset.srcEn?{fr:m.dataset.src,en:m.dataset.srcEn,v:(m.dataset.v||lang)}:null);});
    m.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();m.click();}});
  });

  /* ---------- vues et rideau ---------- */
  var VIEWS=['accueil','films','formats','atelier','faq','brief'];
  var viewEls={}; d.querySelectorAll('.view').forEach(function(v){viewEls[v.dataset.view]=v;});
  var cur='accueil', busy=false;
  var curtain=d.getElementById('curtain'), cLabel=d.getElementById('curtainLabel'), cMark=buildMark(d.getElementById('curtainMark'),'c',true), cLock=d.getElementById('curtainLock');
  var cta=d.getElementById('cta');
  function viewName(v){var el=viewEls[v];return el.getAttribute('data-'+lang)||el.getAttribute('data-fr');}
  function markNav(){d.querySelectorAll('[data-go]').forEach(function(a){a.classList.toggle('on',a.dataset.go===cur);});}
  function activate(v){
    Object.keys(viewEls).forEach(function(k){viewEls[k].classList.toggle('on',k===v);});
    cur=v; markNav();
    if(three)three.setRunning(v==='accueil');
    if(v!=='accueil')wallPlay(false);
    killScroll(); scrollTo(0,{immediate:true}); document.getElementById('nav').classList.remove('hide'); initView(v);
  }
  function pathFor(v){return (lang==='en'?'/en':'')+(v==='accueil'?'/':'/'+v+'/');}
  function setMeta(v){var t=SEO[lang]&&SEO[lang][v];if(t)d.title=t;}
  function pushHash(v,replace){setMeta(v);if(PATHMODE){var u=pathFor(v);if(location.pathname===u&&!location.hash)return;try{replace?history.replaceState(null,'',u):history.pushState(null,'',u);}catch(e){}return;}var h='#'+v;if(location.hash===h)return;try{replace?history.replaceState(null,'',h):history.pushState(null,'',h);}catch(e){location.hash=h;}}
  function go(v,opts){
    opts=opts||{}; if(!viewEls[v]||busy)return;
    if(v===cur){scrollTo(0);return;}
    if(!opts.silent)pushHash(v,false);
    closeMenu();
    if(reduced){activate(v);return;}
    busy=true;
    var name=viewName(v);
    cLabel.innerHTML=name.split('').map(function(ch,k){return '<i style="transition-delay:'+(0.25+k*0.035)+'s">'+(ch===' '?'&nbsp;':ch)+'</i>';}).join('');
    curtain.classList.remove('out'); curtain.classList.add('in'); setMark(cMark,0); cLock.classList.remove('on','w');
    if(lenis)lenis.stop();
    setTimeout(function(){cLock.classList.add('on');playMark(cMark,1100);},200);
    setTimeout(function(){activate(v);},720);
    setTimeout(function(){cLock.classList.add('w');},900);
    setTimeout(function(){curtain.classList.remove('in');curtain.classList.add('out');if(lenis)lenis.start();},1550);
    setTimeout(function(){busy=false;},1650);
    setTimeout(function(){curtain.classList.remove('out');},1850);
  }
  var lastMove=0; function mv(){lastMove=Date.now();}
  addEventListener('wheel',mv,{passive:true}); addEventListener('touchmove',mv,{passive:true}); addEventListener('scroll',mv,{passive:true});
  d.addEventListener('click',function(e){var a=e.target.closest('[data-go]');if(!a)return;e.preventDefault();if(Date.now()-lastMove<350&&!a.closest('.nav,.menu,.navmark'))return;go(a.dataset.go);});
  addEventListener('popstate',function(){var v=PATHMODE&&!location.hash?pathView():location.hash.slice(1);if(viewEls[v]&&v!==cur){go(v,{silent:true});setMeta(v);}});

  /* menu mobile */
  var menu=d.getElementById('menu'), burger=d.querySelector('.burger');
  function closeMenu(){menu.classList.remove('open');body.classList.remove('menu-open');burger.setAttribute('aria-expanded','false');if(lenis&&!lb.classList.contains('open'))lenis.start();}
  addEventListener('keydown',function(e){if(e.key==='Escape'&&menu.classList.contains('open'))closeMenu();});
  burger.addEventListener('click',function(){var o=!menu.classList.contains('open');menu.classList.toggle('open',o);body.classList.toggle('menu-open',o);burger.setAttribute('aria-expanded',String(o));if(lenis){o?lenis.stop():lenis.start();}});
  addEventListener('keydown',function(e){if(e.key==='Escape'){closeLb();closeMenu();}});

  /* ---------- animations au défilement, par vue ---------- */
  var triggers=[];
  function killScroll(){if(!hasGsap)return;ScrollTrigger.getAll().forEach(function(t){t.kill();});triggers=[];gsap.set('.step',{clearProps:'transform,filter'});gsap.set('#vtrack',{clearProps:'transform'});}
  function splitWords(el){el.querySelectorAll('[lang]').forEach(function(sp){if(sp.dataset.split)return;sp.dataset.split='1';sp.innerHTML=sp.textContent.trim().split(/\s+/).map(function(w){return '<span class="w">'+w+'</span>';}).join(' ');});}
  function initCommon(view){
    
    var scope=viewEls[view];
    // apparitions
    var rvs=scope.querySelectorAll('.rv'); var allRv=Array.prototype.slice.call(rvs).concat(Array.prototype.slice.call(d.querySelectorAll('#cta .rv, footer .rv')));
    if(hasGsap&&!reduced){ScrollTrigger.batch(allRv,{start:'top 90%',once:true,onEnter:function(b){b.forEach(function(e,i){setTimeout(function(){e.classList.add('in');},i*70);});}});}
    else{allRv.forEach(function(e){e.classList.add('in');});}
    // texte qui s'allume mot à mot
    scope.querySelectorAll('.reveal').forEach(function(el){
      splitWords(el);
      var words=function(){return Array.prototype.slice.call(el.querySelectorAll('[lang]:not([hidden]) .w'));};
      if(hasGsap&&!reduced){ScrollTrigger.create({trigger:el,start:'top 78%',end:'bottom 42%',scrub:true,onUpdate:function(s){var ws=words(),n=Math.round(s.progress*ws.length);ws.forEach(function(w,i){w.classList.toggle('on',i<n);});}});}
      else{el.querySelectorAll('.w').forEach(function(w){w.classList.add('on');});}
    });
    // lignes de formats qui s'allument
    scope.querySelectorAll('.frow').forEach(function(row){
      if(hasGsap&&!reduced)ScrollTrigger.create({trigger:row,start:'top 72%',end:'bottom 28%',toggleClass:{targets:row,className:'on'}});
      else row.classList.add('on');
    });
  }
  if('IntersectionObserver' in window){var fio=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');fio.unobserve(e.target);}});},{threshold:.35});d.querySelectorAll('.fact').forEach(function(f,i){f.style.transitionDelay='0s';f.querySelector('.m').style.transitionDelay=(.1+i*.12)+'s';f.querySelector('.fd').style.transitionDelay=(.45+i*.12)+'s';fio.observe(f);});}else{d.querySelectorAll('.fact').forEach(function(f){f.classList.add('in');});}
  /* formats : apparition, compteur de prix, vidéos à l'écran seulement */

  var cm=d.getElementById('copyMail');

  /* ---------- horloges ---------- */
  function clocks(){try{var o={hour:'2-digit',minute:'2-digit',hour12:false};d.getElementById('clkParis').textContent=new Intl.DateTimeFormat('fr-FR',Object.assign({timeZone:'Europe/Paris'},o)).format(new Date());d.getElementById('clkHK').textContent=new Intl.DateTimeFormat('fr-FR',Object.assign({timeZone:'Asia/Hong_Kong'},o)).format(new Date());}catch(e){}}

  /* ---------- curseur ---------- */
  if(fine&&!reduced){

    addEventListener('mousemove',function(e){mx2=e.clientX;my2=e.clientY;cursor.style.opacity='1';},{passive:true});

  /* ---------- démarrage ---------- */
  var start=location.hash.slice(1); if(!viewEls[start])start=PATHMODE?pathView():'accueil'; if(!viewEls[start])start='accueil';
  Object.keys(viewEls).forEach(function(k){viewEls[k].classList.toggle('on',k===start);}); cur=start; markNav();
  initHero3D();
  (function(){var nav=d.getElementById('nav'), last=null;
    function probe(){var y=(nav.offsetHeight||64)*.5, el=d.elementFromPoint(innerWidth*.5,y+1); if(!el)return; var s=el.closest('.light,.dark,footer,.lb,.loader,.curtain'); var ink=!!(s&&s.classList&&s.classList.contains('light')); if(ink!==last){last=ink;nav.classList.toggle('ink',ink);}}
    var pend=false; function tick(){if(pend)return;pend=true;requestAnimationFrame(function(){pend=false;nav.style.pointerEvents='none';probe();nav.style.pointerEvents='';});}
    addEventListener('scroll',tick,{passive:true}); addEventListener('resize',tick); setInterval(tick,600); tick();
  })();
  /* ---------- hero : vidéo pilotée par le scroll, textes par temps forts ---------- */
  (function(){
    var hero=d.getElementById('hero'), v=d.getElementById('heroVideo'), b1=d.getElementById('beat1'), tc=d.getElementById('heroTc'), BX=[['beat2',.20,.36],['beat3',.38,.54],['beat4',.56,.72],['beat5',.75,2]].map(function(a){return [d.getElementById(a[0]),a[1],a[2]];});
    if(!hero||!v)return;
    var dur=0, seeking=false, sp=0, shown=-1, vHd=d.getElementById('heroVideoHd'), H=window.__hero||{};
    function target(){return Math.min(sp/.92,1)*dur;}
    function bindV(x){x.addEventListener('seeked',function(){if(x===v)seeking=false;});x.addEventListener('emptied',function(){if(x===v)seeking=false;});}
    /* charge une source (URL blob en mémoire), amorce la lecture (iOS) puis rend la main */
    function load(x,p,cb){if(!x||!p)return;p.then(function(u){var ok=false;function go(){if(ok)return;ok=true;x.pause();cb();}
      x.preload='auto';x.muted=true;x.addEventListener('loadeddata',function(){setTimeout(go,30);},{once:true});x.src=u;
      var q=x.play();if(q&&q.then)q.then(function(){x.pause();}).catch(function(){});});}
    bindV(v); if(vHd)bindV(vHd);
    load(v,H.lo,function(){dur=v.duration||0;v.currentTime=target();v.addEventListener('seeked',function(){v.classList.add('ready');},{once:true});});
    load(vHd,H.hd,function(){var t0=dur?target():0;
      vHd.addEventListener('seeked',function(){var old=v;vHd.classList.add('ready');v=vHd;dur=vHd.duration||dur;seeking=false;
        setTimeout(function(){old.classList.remove('ready');setTimeout(function(){old.removeAttribute('src');old.load();},600);},400);},{once:true});
      vHd.currentTime=t0;});
    var vF=d.getElementById('vFocus'), vAf=d.getElementById('vAf'), vK=-1, vT=0, afF=false;
    (function(){var hs=hero.querySelector('.hero-sticky'); if(!vF||!hs||!fine)return;
      var tx=0,ty=0,px=null,py=null,lt=0,run=false;
      function unlock(){vF.classList.remove('lock');vAf.textContent='AF';clearTimeout(vT);vT=setTimeout(function(){vF.classList.add('lock');vAf.textContent='AF · LOCK';},480);}
      function step(){if(!afF){run=false;return;} px+=(tx-px)*.2; py+=(ty-py)*.2; vF.style.setProperty('--fx',px.toFixed(2)+'%'); vF.style.setProperty('--fy',py.toFixed(2)+'%'); requestAnimationFrame(step);}
      function stop(){if(!afF)return; afF=false; vF.classList.remove('follow'); body.classList.remove('in-hero'); vK=-1; beats(sp);}
      hs.addEventListener('mousemove',function(e){
        if(e.target.closest('a,button,.cta-row,.lang,.pill')){stop();return;}
        var r=hs.getBoundingClientRect(); tx=(e.clientX-r.left)/r.width*100; ty=(e.clientY-r.top)/r.height*100;
        if(!afF){afF=true; var cs=getComputedStyle(vF); px=parseFloat(vF.style.getPropertyValue('--fx'))||64; py=parseFloat(vF.style.getPropertyValue('--fy'))||40; vF.classList.add('follow'); body.classList.add('in-hero');}
        var now=Date.now(); if(now-lt>60){lt=now;unlock();}
        if(!run){run=true;requestAnimationFrame(step);}
      },{passive:true});
      hs.addEventListener('mouseleave',stop);
      addEventListener('scroll',function(){if(afF&&hero.getBoundingClientRect().bottom<innerHeight*.5)stop();},{passive:true});
    })();
    function beats(p){
      b1.classList.toggle('on',p<.18); b1.classList.toggle('off',p>=.18); b1.classList.toggle('it-on',p>=.05||b1.dataset.t==='1');
      BX.forEach(function(b){b[0].classList.toggle('on',p>=b[1]&&p<b[2]);b[0].classList.toggle('off',p>=b[2]);});
      if(vF&&!afF){var port=innerWidth<innerHeight, k=p<.22?0:p<.36?1:p<.62?2:3, P=port?[[52,70],[50,74],[50,76],[50,77]]:[[72,40],[80,32],[72,58],[73,60]];
        if(k!==vK){vK=k;vF.style.setProperty('--fx',P[k][0]+'%');vF.style.setProperty('--fy',P[k][1]+'%');vF.classList.remove('lock');vAf.textContent='AF';clearTimeout(vT);vT=setTimeout(function(){vF.classList.add('lock');vAf.textContent='AF · LOCK';},900);}}
    }
    var vhS=innerHeight, vwS=innerWidth; addEventListener('resize',function(){if(innerWidth!==vwS){vwS=innerWidth;vhS=innerHeight;}});
    function measureSp(){var r=hero.getBoundingClientRect(), s=hero.offsetHeight-vhS||1; sp=clamp(-r.top/s);}
    addEventListener('scroll',measureSp,{passive:true}); addEventListener('resize',measureSp);
    var shownT=-1;
    (function tick(){
      if(dur&&!seeking&&!reduced&&v.readyState>=1){var t=target(); if(Math.abs(t-v.currentTime)>0.02){seeking=true;v.currentTime=t;}}
      beats(sp);
      if(tc){var t2=Math.min(sp/.92,1)*(dur||12.03), s=Math.floor(t2), f=Math.floor((t2-s)*30); if(f!==shownT){shownT=f;tc.textContent='00:'+pad(s)+':'+pad(f);}}
      requestAnimationFrame(tick);
    })();
    measureSp(); beats(0); b1.classList.add('on'); setTimeout(function(){b1.dataset.t='1';beats(sp);},1600);
    if(reduced){b1.classList.add('it-on');}
  })();
  var loader=d.getElementById('loader'), lMark=buildMark(d.getElementById('loaderMark'),'l',true), lLock=d.getElementById('loaderLock'), lDone=false;
  // signature du pied : le 八 se trace en or, puis se pose en encre claire
  (function(){var w=d.querySelector('.wordmark2'), tt=d.getElementById('toTop'); if(tt)tt.addEventListener('click',function(){scrollTo(0);});
    if(w&&'IntersectionObserver' in window){new IntersectionObserver(function(es){es.forEach(function(e){w.classList.toggle('in',e.isIntersecting);});},{threshold:.4}).observe(w);}else if(w)w.classList.add('in');})();
  var fsig=d.getElementById('fsig'), fMark=buildMark(d.getElementById('footMark'),'f'), fOn=false; setMark(fMark,0);
  if('IntersectionObserver' in window){new IntersectionObserver(function(es){es.forEach(function(e){
    if(e.isIntersecting&&e.intersectionRatio>=.25){if(!fOn){fOn=true;fsig.classList.remove('set');playMark(fMark,1700).then(function(){fsig.classList.add('set');});}}
    else if(!e.isIntersecting&&fOn){fOn=false;fsig.classList.remove('set');setMark(fMark,0);}
  });},{threshold:[0,.25]}).observe(fsig);}else{setMark(fMark,1);fsig.classList.add('set');}
  function endLoader(){
    if(lDone)return; lDone=true;
    initView(cur); pushHash(cur,true);
    loader.classList.add('done'); root.classList.add('loaded');
    setTimeout(function(){loader.remove();},1000);
  }
  function runLoader(){

    if(lenis)lenis.stop();

    setTimeout(function(){endLoader();if(lenis)lenis.start();},2000);
  }
  if(d.fonts&&d.fonts.ready){var fired=false;function once(){if(!fired){fired=true;runLoader();}}d.fonts.ready.then(function(){setTimeout(once,100);});setTimeout(once,1400);}else{setTimeout(runLoader,300);}
})();
